<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Bar Chart Colors matching image -->
    <linearGradient id="barLightBlue" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="barMidBlue" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="barTeal" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Background Circle -->
  <circle cx="250" cy="250" r="235" fill="url(#bgGlow)" stroke="#1e293b" stroke-width="6"/>
  <circle cx="250" cy="250" r="215" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 6" opacity="0.3"/>

  <g filter="url(#glow)">
    
    <!-- LETTER 'A' -->
    <path d="M 85 280 L 145 100 L 180 100 L 120 280 Z" fill="url(#barLightBlue)"/>
    <path d="M 145 100 L 205 280 L 170 280 L 133 160 Z" fill="url(#barMidBlue)" opacity="0.9"/>
    <rect x="110" y="205" width="65" height="12" rx="6" fill="#38bdf8"/>

    <!-- LETTER 'M' -->
    <rect x="235" y="100" width="28" height="180" rx="6" fill="url(#barMidBlue)"/>
    <rect x="375" y="100" width="28" height="180" rx="6" fill="url(#barTeal)"/>
    <path d="M 263 115 Q 285 250 305 250 T 375 115" fill="none" stroke="url(#barTeal)" stroke-width="18" stroke-linecap="round"/>

    <!-- Overlay Trend Arrow Line -->
    <path d="M 250 130 C 285 270 325 260 405 80" stroke="#67e8f9" stroke-width="4" fill="none" stroke-linecap="round"/>
    <polygon points="392,68 418,80 397,94" fill="#67e8f9"/>

    <!-- MINI BAR CHART COLUMNS AT THE BOTTOM (Scaled down) -->
    <!-- Left Small Bar -->
    <rect x="195" y="340" width="30" height="45" rx="8" fill="url(#barLightBlue)"/>

    <!-- Middle Medium Bar -->
    <rect x="235" y="315" width="30" height="70" rx="8" fill="url(#barMidBlue)"/>

    <!-- Right Tall Bar -->
    <rect x="275" y="290" width="30" height="95" rx="8" fill="url(#barTeal)"/>

    <!-- Base Glow Line under bars -->
    <line x1="170" y1="395" x2="330" y2="395" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>
